<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifest</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
    }

    .content-wrapper {
      width: 90%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    video {
      width: 100%;
      border: 2px solid white;
    }

    .caption {
      font-size: 1.1rem;
      line-height: 1.5;
      padding: 10px;
      border-left: 2px solid white;
    }

    .nav-buttons {
      margin: 40px 0;
      display: flex;
      gap: 20px;
    }

    .nav-buttons a {
      padding: 10px 20px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .nav-buttons a:hover {
      background: #444;
      color: white;
    }
  </style>
</head>
<body>
  <h1>030525</h1>

  <div class="content-wrapper">
    <video controls>
      <source src="your-video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="caption">
      Your caption text goes here. You can write multiple lines and explain the video or add lore.
    </div>
  </div>

  <div>
  <a href="previous.html">Back</a>

</div>
</body>
</html>
